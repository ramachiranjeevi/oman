<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#4a78c8"/>
      <stop offset="55%" stop-color="#2850a0"/>
      <stop offset="100%" stop-color="#1a346e"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2c989"/>
      <stop offset="50%" stop-color="#c6a15b"/>
      <stop offset="100%" stop-color="#a8843f"/>
    </linearGradient>
    <linearGradient id="reel" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7e4fb"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#0d1f44" flood-opacity=".28"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="61" fill="url(#ring)"/>
  <circle cx="64" cy="64" r="55.5" fill="#f4f7fd"/>
  <circle cx="64" cy="64" r="52.5" fill="url(#bg)"/>

  <g filter="url(#soft)" transform="translate(64 60) rotate(-18)">
    <!-- film reel body -->
    <circle cx="0" cy="0" r="28" fill="url(#reel)"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#bcd0f2" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="10.5" fill="#2850a0"/>
    <circle cx="0" cy="0" r="4.2" fill="#e8effc"/>

    <!-- sprocket holes -->
    <g fill="#2850a0" opacity=".92">
      <circle cx="0" cy="-19" r="3.1"/>
      <circle cx="13.4" cy="-13.4" r="3.1"/>
      <circle cx="19" cy="0" r="3.1"/>
      <circle cx="13.4" cy="13.4" r="3.1"/>
      <circle cx="0" cy="19" r="3.1"/>
      <circle cx="-13.4" cy="13.4" r="3.1"/>
      <circle cx="-19" cy="0" r="3.1"/>
      <circle cx="-13.4" cy="-13.4" r="3.1"/>
    </g>

    <!-- film strip -->
    <g transform="translate(18 10) rotate(28)">
      <path d="M0 0h14c2.2 0 4 1.8 4 4v34c0 2.2-1.8 4-4 4H0c-2.2 0-4-1.8-4-4V4c0-2.2 1.8-4 4-4z"
            fill="url(#reel)" stroke="#bcd0f2" stroke-width="1.2"/>
      <g fill="#2850a0">
        <rect x="-1.2" y="3" width="2.4" height="3.2" rx="0.6"/>
        <rect x="-1.2" y="10" width="2.4" height="3.2" rx="0.6"/>
        <rect x="-1.2" y="17" width="2.4" height="3.2" rx="0.6"/>
        <rect x="-1.2" y="24" width="2.4" height="3.2" rx="0.6"/>
        <rect x="-1.2" y="31" width="2.4" height="3.2" rx="0.6"/>
        <rect x="12.8" y="3" width="2.4" height="3.2" rx="0.6"/>
        <rect x="12.8" y="10" width="2.4" height="3.2" rx="0.6"/>
        <rect x="12.8" y="17" width="2.4" height="3.2" rx="0.6"/>
        <rect x="12.8" y="24" width="2.4" height="3.2" rx="0.6"/>
        <rect x="12.8" y="31" width="2.4" height="3.2" rx="0.6"/>
      </g>
      <rect x="2.2" y="4" width="9.6" height="7" rx="1.2" fill="#2850a0" opacity=".2"/>
      <rect x="2.2" y="14" width="9.6" height="7" rx="1.2" fill="#2850a0" opacity=".2"/>
      <rect x="2.2" y="24" width="9.6" height="7" rx="1.2" fill="#2850a0" opacity=".2"/>
    </g>
  </g>
</svg>
