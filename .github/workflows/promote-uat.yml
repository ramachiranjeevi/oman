name: Promote to UAT

# Two-stage gate for shipping Directus schema (field) changes and Camunda
# BPMN/DMN (process flow) changes from a developer's DEV machine to UAT:
#
#   1. Pull request review — a human approves the PR diff (schema snapshot
#      JSON + BPMN/DMN XML) before it can merge to main.
#   2. GitHub Environment approval — merging to main queues the promote job
#      against the "uat" environment, which requires a *second*, explicit
#      "Approve and deploy" click (Settings → Environments → uat → Required
#      reviewers) before anything touches UAT.
#
# Promote talks to the *public Platform URL* with CI_PROMOTE_API_KEY. The
# Platform on UAT then applies artifacts to local Directus/Camunda (ports
# 8055/8080 stay private — see SETUP.md).

on:
  pull_request:
    branches: [main]
    paths:
      - 'directus/schema/**'
      - 'camunda-module/configuration/resources/**'
      - '.github/workflows/promote-uat.yml'
      - 'ops/ci-push-artifacts.mjs'
      - 'ops/promote-directus-schema.mjs'
      - 'ops/promote-camunda-resources.mjs'
  push:
    branches: [main]
    paths:
      - 'directus/schema/**'
      - 'camunda-module/configuration/resources/**'
      - '.github/workflows/promote-uat.yml'
      - 'ops/ci-push-artifacts.mjs'
      - 'ops/promote-directus-schema.mjs'
      - 'ops/promote-camunda-resources.mjs'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you promoting manually? (demo / hotfix)'
        required: false
        default: 'manual demo'

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Summarize config changes for the reviewer
        run: |
          echo "## Config changes in this PR" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- directus/schema camunda-module/configuration/resources | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate BPMN/DMN files are well-formed XML
        run: |
          shopt -s nullglob
          for f in camunda-module/configuration/resources/*.bpmn camunda-module/configuration/resources/*.dmn; do
            echo "checking $f"
            python3 -c "import xml.dom.minidom as m; m.parse('$f')"
          done

      - name: Validate Directus schema snapshot is valid JSON
        run: |
          shopt -s nullglob
          for f in directus/schema/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('$f OK')"
          done

  promote-uat:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: uat
    env:
      UAT_PLATFORM_URL: ${{ vars.UAT_PLATFORM_URL || secrets.UAT_PLATFORM_URL || 'https://omandp.paradigmit.com' }}
      CI_PROMOTE_API_KEY: ${{ secrets.CI_PROMOTE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Show checkout revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git log -1 --oneline
          echo "UAT_PLATFORM_URL host will be used from env (secret redacted)"
          python3 - <<'PY'
          from pathlib import Path
          b = Path('directus/schema/directus-schema.json').read_bytes()[:4]
          print('schema magic', list(b))
          assert b[:1] in (b'{', b'['), b
          print('schema OK')
          PY

      - name: Require CI_PROMOTE_API_KEY
        run: |
          if [ -z "${CI_PROMOTE_API_KEY}" ]; then
            echo "::error::CI_PROMOTE_API_KEY is empty"
            exit 1
          fi
          echo "CI_PROMOTE_API_KEY length=${#CI_PROMOTE_API_KEY}"

      # Pure curl/python — do NOT use ops/ci-push-artifacts.mjs here.
      # (Old revisions of that script mis-read argv[0]/node ELF) as the schema file.)
      - name: Promote Directus schema to UAT
        run: |
          set -euo pipefail
          BASE="${UAT_PLATFORM_URL%/}"
          CODE=$(curl -sS -o /tmp/schema-out.json -w "%{http_code}" \
            -X POST "${BASE}/api/ci/promote-schema" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${CI_PROMOTE_API_KEY}" \
            --data-binary @directus/schema/directus-schema.json)
          echo "HTTP $CODE"
          head -c 800 /tmp/schema-out.json; echo
          test "$CODE" = "200"

      - name: Promote Camunda BPMN/DMN to UAT
        run: |
          set -euo pipefail
          BASE="${UAT_PLATFORM_URL%/}"
          python3 <<'PY'
          import json, os, pathlib, urllib.error, urllib.request
          base = os.environ["UAT_PLATFORM_URL"].rstrip("/")
          key = os.environ["CI_PROMOTE_API_KEY"]
          root = pathlib.Path("camunda-module/configuration/resources")
          files = {
              p.name: p.read_text(encoding="utf-8")
              for p in sorted(root.iterdir())
              if p.suffix.lower() in (".bpmn", ".dmn")
          }
          print(f"Uploading {len(files)} resource(s): {', '.join(files)}")
          body = json.dumps({"files": files}).encode("utf-8")
          req = urllib.request.Request(
              f"{base}/api/ci/promote-camunda",
              data=body,
              headers={"Content-Type": "application/json", "X-Api-Key": key},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as res:
                  raw = res.read()
                  print("HTTP", res.status)
                  print(raw[:800].decode("utf-8", errors="replace"))
          except urllib.error.HTTPError as e:
              print("HTTP", e.code)
              print(e.read()[:800].decode("utf-8", errors="replace"))
              raise SystemExit(1)
          PY
