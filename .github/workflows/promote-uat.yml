name: Promote to UAT

# Two-stage gate for shipping Directus schema (field) changes and Camunda
# BPMN/DMN (process flow) changes from a developer's DEV machine to UAT:
#
#   1. Pull request review — a human approves the PR diff (schema snapshot
#      JSON + BPMN/DMN XML) before it can merge to main.
#   2. GitHub Environment approval — merging to main queues the promote job
#      against the "uat" environment, which requires a *second*, explicit
#      "Approve and deploy" click (Settings → Environments → uat → Required
#      reviewers) before anything touches UAT.
#
# Promote talks to the *public Platform URL* with CI_PROMOTE_API_KEY. The
# Platform on UAT then applies artifacts to local Directus/Camunda (ports
# 8055/8080 stay private — see SETUP.md).

on:
  pull_request:
    branches: [main]
    paths:
      - 'directus/schema/**'
      - 'camunda-module/configuration/resources/**'
      - '.github/workflows/promote-uat.yml'
      - 'ops/ci-push-artifacts.mjs'
      - 'ops/promote-directus-schema.mjs'
      - 'ops/promote-camunda-resources.mjs'
  push:
    branches: [main]
    paths:
      - 'directus/schema/**'
      - 'camunda-module/configuration/resources/**'
      - '.github/workflows/promote-uat.yml'
      - 'ops/ci-push-artifacts.mjs'
      - 'ops/promote-directus-schema.mjs'
      - 'ops/promote-camunda-resources.mjs'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you promoting manually? (demo / hotfix)'
        required: false
        default: 'manual demo'

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Summarize config changes for the reviewer
        run: |
          echo "## Config changes in this PR" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- directus/schema camunda-module/configuration/resources | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate BPMN/DMN files are well-formed XML
        run: |
          shopt -s nullglob
          for f in camunda-module/configuration/resources/*.bpmn camunda-module/configuration/resources/*.dmn; do
            echo "checking $f"
            python3 -c "import xml.dom.minidom as m; m.parse('$f')"
          done

      - name: Validate Directus schema snapshot is valid JSON
        run: |
          shopt -s nullglob
          for f in directus/schema/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('$f OK')"
          done

  promote-uat:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Deploy-time approval gate: pauses until a required reviewer on the
    # "uat" environment approves in the GitHub Actions UI.
    environment: uat
    # Public UAT host — prefer repo Variable; fall back to Secret; then default.
    # (Environment-scoped secrets override repo secrets — fix bad values under
    # Settings → Environments → uat, not only repo secrets.)
    env:
      UAT_PLATFORM_URL: ${{ vars.UAT_PLATFORM_URL || secrets.UAT_PLATFORM_URL || 'https://omandp.paradigmit.com' }}
      CI_PROMOTE_API_KEY: ${{ secrets.CI_PROMOTE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show checkout revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git log -1 --oneline
          grep -n "CI_PROMOTE_SCRIPT_VERSION" ops/ci-push-artifacts.mjs
          file directus/schema/directus-schema.json
          xxd -l 8 directus/schema/directus-schema.json
          # Must be JSON object, never ELF
          python3 - <<'PY'
          from pathlib import Path
          b = Path('directus/schema/directus-schema.json').read_bytes()[:4]
          print('magic', list(b))
          if b[:4] == b'\x7fELF':
              raise SystemExit('schema file is ELF — checkout is wrong')
          if b[:1] not in (b'{', b'['):
              raise SystemExit(f'schema file not JSON, first bytes={b!r}')
          print('schema file looks like JSON')
          PY

      - name: Validate promote configuration
        run: node ops/ci-push-artifacts.mjs --check-env

      - name: Probe promote-schema endpoint
        run: |
          set -e
          CODE=$(curl -sS -o /tmp/promote-probe.out -w "%{http_code}" \
            -X POST "${UAT_PLATFORM_URL}/api/ci/promote-schema" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${CI_PROMOTE_API_KEY}" \
            --data-binary @directus/schema/directus-schema.json)
          CTYPE=$(file -b /tmp/promote-probe.out || true)
          echo "HTTP $CODE"
          echo "file(1): $CTYPE"
          xxd -l 16 /tmp/promote-probe.out || true
          echo "body head:"
          head -c 400 /tmp/promote-probe.out; echo
          echo "## Promote probe" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTTP status: \`$CODE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Body type: \`$CTYPE\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" != "200" ]; then
            echo "::error::promote-schema probe returned HTTP $CODE"
            exit 1
          fi
          if head -c 4 /tmp/promote-probe.out | grep -q $'\x7fELF'; then
            echo "::error::promote-schema returned an ELF binary — nginx/proxy misrouted /api/ci/promote-schema"
            exit 1
          fi

      - name: Promote Camunda BPMN/DMN only
        run: |
          # Schema already applied by probe; still run full script for Camunda + clear logs
          node ops/ci-push-artifacts.mjs
